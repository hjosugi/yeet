name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK and layer-shell build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev libwayland-dev wayland-protocols
          meson ninja-build
          patchelf desktop-file-utils librsvg2-dev libgdk-pixbuf-2.0-dev file
      - name: Build gtk4-layer-shell
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr/local \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo xtask version)"
          test "$version" = "$cargo_version"
      - name: Package tarball and AppImage
        shell: bash
        run: |
          cargo xtask package linux-tar
          cargo xtask package appimage
      - name: Build the installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --release --locked -p yeetup
          install -Dm755 target/release/yeetup "dist/yeetup-${version}-linux-x86_64"
      - name: Write checksums
        run: cargo xtask checksums linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            zip
      - name: Build and bundle GTK runtime
        shell: msys2 {0}
        run: |
          cargo build --release --locked
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$cargo_version"
          bash scripts/bundle-windows.sh
      - name: Detect optional signing configuration
        id: signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Set both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD, or neither."
          }
          "enabled=$($hasCertificate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Sign portable executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $pfx = Join-Path $env:RUNNER_TEMP "yeet-signing-$([guid]::NewGuid()).pfx"
          try {
            $base64 = [regex]::Replace($env:CERTIFICATE_BASE64, '\s', '')
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            ./packaging/windows/Sign-WindowsArtifacts.ps1 `
              -Path "yeet-$version-windows-x64/yeet.exe" `
              -CertificatePath $pfx -CertificatePassword $password
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Verify portable runtime and topmost windows
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $root = Join-Path $PWD "yeet-$version-windows-x64"
          $env:PATH = "$root;$env:SystemRoot\System32;$env:SystemRoot"
          ./scripts/Test-WindowsRuntime.ps1 -Executable (Join-Path $root "yeet.exe")
      - name: Archive portable build
        shell: msys2 {0}
        run: |
          cargo xtask package windows-zip
          cp dist/*.zip .
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/windows/yeet.iss
      - name: Sign Windows installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $pfx = Join-Path $env:RUNNER_TEMP "yeet-signing-$([guid]::NewGuid()).pfx"
          try {
            $base64 = [regex]::Replace($env:CERTIFICATE_BASE64, '\s', '')
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            ./packaging/windows/Sign-WindowsArtifacts.ps1 `
              -Path "yeet-$version-windows-x64-setup.exe" `
              -CertificatePath $pfx -CertificatePassword $password
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Build the installer
        shell: msys2 {0}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --release --locked -p yeetup
          cp target/release/yeetup.exe "yeetup-${version}-windows-x64.exe"
      - name: Write Windows checksums
        shell: msys2 {0}
        run: sha256sum yeet-*.zip yeet-*-setup.exe yeetup-*.exe > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            yeet-*.zip
            yeet-*-setup.exe
            yeetup-*.exe
            SHA256SUMS-windows.txt

  # Yeet has no macOS platform backend yet: this proves the GTK build keeps
  # compiling and publishes a disk image, but the shelf there is an ordinary
  # window without the always-on-top, tray and global-shortcut integration the
  # Linux and Windows backends provide. A macOS failure must not hold back the
  # platforms that are supported, so the job is allowed to fail.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK
        run: brew install gtk4 pkg-config
      - name: Package disk image and installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(cargo xtask version)"
          cargo xtask package macos-dmg
          cargo build --release --locked -p yeetup
          install -m755 target/release/yeetup "dist/yeetup-${version}-macos-$(uname -m)"
          cargo xtask checksums macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  publish:
    # macOS is allowed to fail, so it gates only the wait, never the release.
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release -type f -print0)
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${assets[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${assets[@]}" \
              --repo "${{ github.repository }}" --verify-tag --generate-notes
          fi
