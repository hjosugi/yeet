[workspace]
members = ["xtask", "yeetup"]
# The application is what `cargo build`/`cargo test` should reach by default;
# the packaging tool and the installer are built explicitly with `-p`.
default-members = ["."]

[package]
name = "yeet"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
description = "A native drag-and-drop shelf for Wayland and Windows"
license = "MIT"
repository = "https://github.com/hjosugi/yeet"

[[bin]]
name = "yeet"
path = "src/main.rs"

[dependencies]
# Wakes the GTK main loop when a background thread actually has something to
# report, which is what lets the resident process sit at zero timers.
async-channel = "2.5"
directories = "6.0"
gio = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3"
gdk4-x11 = "0.11"
gtk4-layer-shell = "0.8"
ksni = "0.3.5"
tokio = { version = "1", features = ["rt", "time"] }
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gdk-win32 = { package = "gdk4-win32", version = "0.11", features = ["win32"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.20"

[profile.dev]
# Full debug info for every crate in the tree dominates a clean debug build.
# Line tables keep backtraces and panic locations useful, which is what the
# information is actually used for here.
debug = "line-tables-only"

# Nobody steps into gtk4-sys or zbus, so dependencies carry no debug info at
# all. This is the single biggest cut to a cold build and to the size of
# target/.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
